# Beta release track (UAT branch) — build & publish testable artifacts before
# anything is cut on main.
#
# Beta builds use an orderable `beta-v<base>.<build>` version scheme (COL-96),
# derived automatically per build by the `meta` job — no manual pyproject bump:
#   * <base>  = next patch after the latest stable `v*.*.*` git tag
#               (e.g. latest stable `v0.2.0` → base `0.2.1`, until the next
#               real tag lands, then it advances to whatever's next).
#   * <build> = zero-padded 4-digit count of commits since that stable tag
#               (`git rev-list --count <tag>..HEAD`), restarting at `0001`
#               right after each real release.
# So consecutive uat pushes produce `beta-v0.2.1.0001`, `beta-v0.2.1.0002`, …
# which sort correctly as plain strings (unlike the old random hex short-SHA).
#
# Fires on every push to `uat`, then:
#   1. test-*       — same backend (pytest/ruff/mypy) + frontend (vitest/tsc/
#                     eslint) gate as the tagged release pipeline (release.yml);
#                     any failure stops artifacts from being published.
#   2. docker       — multi-arch (amd64+arm64) image build & push to Docker
#                     Hub, tagged `beta` (rolling, always the latest uat push)
#                     and `beta-v<base>.<build>` (immutable, for pinning a build).
#   3. build-wheel  — same frontend-then-wheel build as release.yml, but
#                     stamped with a `<base>.<build>+beta` version (an orderable
#                     4-part release segment plus a bare `+beta` local marker)
#                     so it's never mistaken for a real PyPI release.
#   4. github-release — publishes a GitHub Release marked "Pre-release" (tag
#                     `beta-v<base>.<build>`) with the wheel/sdist attached, so
#                     bare-metal/pipx users have somewhere to get a beta build
#                     from (`pipx install <downloaded .whl>`).
#
# No PyPI publish here — that stays tied to a semver tag landing on main
# (release.yml). This track exists purely so a beta build (Docker image or
# wheel) can be pulled/downloaded ahead of that.
#
# Credentials: reuses the same Docker Hub secrets as release.yml
# (secrets.DOCKERHUB_USERNAME + secrets.DOCKERHUB_TOKEN). The GitHub Release
# uses the auto-provided secrets.GITHUB_TOKEN, same as release.yml.

name: beta

on:
  push:
    branches:
      - uat
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE_NAME: odxnsson/collapsarr
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  test-backend:
    name: Backend tests (pytest / ruff / mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend with dev extras
        run: pip install -e ".[dev]"
      - name: Ruff
        # `packaging` (COL-216: the PyInstaller build recipe) is swept in
        # alongside the app/test trees -- see pyproject.toml's ruff
        # `extend-include` for why the .spec file needs it explicitly.
        run: ruff check collapsarr tests packaging
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  test-frontend:
    name: Frontend tests (vitest / tsc / eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test

  meta:
    name: Derive beta version + tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # fetch-depth: 0 pulls the full history + tags so `git tag`/`git rev-list`
      # can see the latest stable tag and count commits since it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Derive orderable beta version + tag
        run: |
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
            BUILD_COUNT=$(git rev-list --count HEAD)
          else
            BUILD_COUNT=$(git rev-list --count "${LATEST_TAG}..HEAD")
          fi
          LATEST_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          BASE_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          BUILD_NUMBER=$(printf "%04d" "$BUILD_COUNT")
          VERSION="${BASE_VERSION}.${BUILD_NUMBER}"
          echo "Derived beta version ${VERSION} (latest stable tag ${LATEST_TAG}, ${BUILD_COUNT} commits since)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=beta-v${VERSION}" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & push beta image
    needs: [test-backend, test-frontend, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:beta
            ${{ env.IMAGE_NAME }}:${{ needs.meta.outputs.tag }}
          provenance: false

  # ---- Build the wheel + sdist (for bare-metal/pipx users) --------------------
  # Mirrors release.yml's build-wheel job: frontend first, so frontend/dist
  # exists when `python -m build` bundles it into collapsarr/static (COL-40).
  build-wheel:
    name: Build wheel + sdist
    needs: [test-backend, test-frontend, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (produces frontend/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stamp the orderable beta version
        run: |
          VERSION="${{ needs.meta.outputs.version }}+beta"
          echo "Building beta version ${VERSION}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the frontend was bundled into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel produced")
          names = zipfile.ZipFile(wheels[0]).namelist()
          if not any(n.startswith("collapsarr/static/") for n in names):
              sys.exit("frontend assets missing from wheel (collapsarr/static/ not found)")
          print("OK: frontend bundled into", wheels[0])
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---- Cut a GitHub Pre-release with the wheel/sdist attached -----------------
  github-release:
    name: Create GitHub Pre-release
    needs: [build-wheel, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Beta build ${{ needs.meta.outputs.tag }}
          prerelease: true
          make_latest: 'false'
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
