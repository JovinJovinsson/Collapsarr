[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collapsarr"
version = "0.1.0"
description = "An *arr-family companion app that adds downmixed (stereo/2.1/5.1) audio tracks to media missing them, via FFmpeg."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jovin Jovinsson" }]
keywords = ["arr", "sonarr", "radarr", "ffmpeg", "audio", "downmix"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "itsdangerous>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
collapsarr = "collapsarr.__main__:main"

[project.urls]
Homepage = "https://github.com/JovinJovinsson/Collapsarr"
Repository = "https://github.com/JovinJovinsson/Collapsarr"

# The built Vite/React frontend (frontend/dist) is bundled into the wheel as
# package data under collapsarr/static and served by FastAPI at runtime
# (COL-40, Bazarr's approach). `python -m build` does NOT run `npm run build`;
# the frontend must be built first (Dockerfile stage 1 / the release pipeline
# in COL-41 do this before invoking the wheel build).
#
# `artifacts` overrides the .gitignore exclusion of frontend/dist so the
# sdist picks it up naturally (its file selection isn't restricted to
# `packages`, unlike the wheel). The wheel instead bundles it via the
# hatch_build.py hook, scoped to the wheel target only: hatchling reserves
# any path passed to `force_include`, which — if this hook applied
# globally — would silently prune frontend/dist out of the sdist's natural
# inclusion without actually force-including it there either. Scoping to
# wheel also means `pip install -e` (which never touches the wheel's
# "standard" version) doesn't require frontend/dist to exist.
[tool.hatch.build]
artifacts = ["frontend/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["collapsarr"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["collapsarr", "tests", "packaging"]
# Alembic-managed files: env.py is boilerplate with a side-effecting model-import
# block, and versions/*.py are autogenerated (and named with a leading date, so
# not importable modules). Neither is hand-maintained to our lint rules.
extend-exclude = ["collapsarr/migrations/env.py", "collapsarr/migrations/versions"]
# PyInstaller spec files (packaging/pyinstaller/collapsarr.spec, COL-216) are
# ordinary Python but conventionally use a `.spec` extension that ruff's
# directory-recursion default (*.py/*.pyi) skips -- opt it back in explicitly
# so `ruff check packaging` actually lints it, not just the .py files beside it.
extend-include = ["*.spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["collapsarr"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires calling Depends(...) (and
# similarly Query/Path/Body) in argument defaults; B008 would otherwise flag
# every route that uses it.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
# `packaging/pyinstaller` (COL-216) is listed both as a directory (sweeps in
# build.py/entrypoint.py -- mypy's directory recursion only picks up *.py/
# *.pyi) and as the explicit collapsarr.spec path (a .spec file mypy's
# recursion would otherwise skip, but which it checks fine as an explicit
# target -- same reasoning as ruff's `extend-include` above).
files = [
    "collapsarr",
    "tests",
    "packaging/pyinstaller",
    "packaging/pyinstaller/collapsarr.spec",
]
strict = true
plugins = ["pydantic.mypy"]
# Alembic env.py (boilerplate) and the autogenerated versions/*.py (date-prefixed
# filenames aren't valid module names) are not type-checked under strict.
exclude = ['^collapsarr/migrations/env\.py$', '^collapsarr/migrations/versions/']

# PyInstaller (packaging/pyinstaller/collapsarr.spec, COL-216) is a build-time
# tool, not a runtime or `[dev]` dependency -- installed ad hoc in the CI job
# that actually runs PyInstaller (release.yml's native-build-linux), not via
# `pip install -e ".[dev]"`. Its import is therefore unresolvable wherever
# mypy runs without it (e.g. the plain `mypy` invocation in test-backend/
# beta.yml), so it's exempted from import resolution here rather than adding
# a build-only tool to the dev extras every contributor installs.
[[tool.mypy.overrides]]
module = ["PyInstaller.*"]
ignore_missing_imports = true
